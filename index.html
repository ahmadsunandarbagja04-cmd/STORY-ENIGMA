<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story of Enigma - Call of Cthulhu Companion V5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0c0c0b; color: #d4cfb8; font-family: 'Courier New', Courier, monospace; overflow-x: hidden; }
    #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    
    .header-title { text-align: center; padding: 25px 10px 5px 10px; letter-spacing: 4px; color: #cca54a; font-size: 1.8rem; font-weight: bold; }
    .header-subtitle { text-align: center; font-size: 0.75rem; color: #7c7662; letter-spacing: 2px; margin-bottom: 25px; }
    
    /* GAMES STORY OF ENIGMA CENTER DISPLAY */
    .enigma-story-title { 
      text-align: center; 
      background: #11110f; 
      border: 1px dashed #8a7846; 
      padding: 20px 15px; 
      margin: 20px 15px 30px 15px; 
      font-size: 1.2rem; 
      font-weight: bold;
      letter-spacing: 3px;
      color: #cca54a;
      text-transform: uppercase;
    }
    
    .menu-utama-container { display: flex; flex-direction: column; gap: 15px; padding: 0 15px; }
    .btn-utama { background: #1c1c19; border: 1px solid #cca54a; color: #cca54a; padding: 15px; font-size: 1rem; font-weight: bold; font-family: monospace; border-radius: 6px; cursor: pointer; text-align: center; letter-spacing: 1px; transition: all 0.2s; }
    .btn-utama:hover { background: #24221c; }
    .btn-secondary { background: transparent; border: 1px solid #444; color: #888; padding: 12px; font-size: 0.9rem; font-family: monospace; border-radius: 6px; cursor: pointer; text-align: center; }
    .btn-secondary:hover { border-color: #7c7662; color: #d4cfb8; }
    
    .tab-container { display: flex; border-bottom: 1px solid #2d2a22; margin: 0 10px; }
    .tab-nav { flex: 1; text-align: center; padding: 10px; background: #141412; border: 1px solid #2d2a22; border-bottom: none; color: #7c7662; font-size: 0.85rem; cursor: pointer; }
    .tab-nav.active { background: #1c1c19; color: #cca54a; border-top: 2px solid #cca54a; font-weight: bold; }
    .content-panel { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; }
    
    .box-card { background: #161614; border: 1px solid #2d2a22; border-radius: 6px; padding: 12px; margin-bottom: 12px; position: relative; }
    .btn-gold-outline { background: transparent; border: 1px solid #cca54a; color: #cca54a; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-bottom: 10px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.7rem; color: #8a7846; margin-bottom: 3px; letter-spacing: 1px; }
    .input-field { width: 100%; padding: 8px; background: #0c0c0b; border: 1px solid #3d392e; color: #d4cfb8; border-radius: 4px; font-family: monospace; font-size: 0.85rem; }
    
    .carousel-wrapper { display: flex; align-items: center; justify-content: space-between; background: #11110f; border: 1px solid #2d2a22; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
    .carousel-btn { background: #1c1c19; border: 1px solid #3d392e; color: #cca54a; font-size: 1.2rem; width: 32px; height: 32px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    .carousel-info-text { font-size: 0.75rem; color: #7c7662; letter-spacing: 1px; }
    
    .char-profile-layout { display: flex; gap: 15px; margin-bottom: 12px; }
    .char-photo-box { width: 90px; height: 135px; background: #222; border: 1px solid #3d392e; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .char-photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .char-name-display { font-size: 1.4rem; font-weight: bold; color: #cca54a; margin-bottom: 5px; }
    
    .btn-start-play { position: fixed; bottom: 15px; right: 15px; background: #b08d42; color: #0c0c0b; border: none; padding: 10px 20px; font-size: 0.9rem; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5); z-index: 99; }
    
    /* MAIN GAMEPLAY LAYOUT */
    .main-game-screen { display: flex; width: 100vw; height: 100vh; background: #050505; position: relative; }
    .sidebar-menu { width: 50px; background: #11110f; border-right: 1px solid #2d2a22; display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 8px; z-index: 10; }
    .menu-btn { width: 36px; height: 36px; background: #161614; border: 1px solid #3d392e; color: #7c7662; font-weight: bold; font-family: monospace; cursor: pointer; border-radius: 4px; font-size: 0.9rem; }
    .menu-btn.active { border-color: #cca54a; color: #cca54a; background: #24221c; }
    
    .workspace { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 90px; }
    .panel-header { font-size: 0.8rem; color: #cca54a; border-bottom: 1px solid #2d2a22; padding-bottom: 4px; margin-bottom: 10px; display: flex; justify-content: space-between; font-weight: bold; }
    
    .board-container { position: relative; width: 100%; height: 340px; background: #141412; overflow: hidden; margin-bottom: 12px; border-radius: 4px; background-size: cover; background-position: center; }
    
    /* DETAIL TOKEN BARU: MURNI KOTAK FOTO TANPA BORDER & LABEL */
    .token-item { 
      position: absolute; 
      width: 55px; 
      height: 55px; 
      cursor: move; 
      display: flex; 
      overflow: hidden; 
      user-select: none; 
      border-radius: 0px; /* Tetap Kotak Sempurna */
      border: none !important;
      background: transparent !important;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    .token-item img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    
    .bar-select { background: #1c1c19; border: 1px solid #3d392e; color: #d4cfb8; padding: 6px; border-radius: 4px; font-family: monospace; font-size: 0.75rem; }
    .bar-btn { background: #b08d42; border: none; color: #0c0c0b; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.75rem; white-space: nowrap; }
    
    .movement-panel { background: #1a1a17; border: 1px solid #8a7846; border-radius: 6px; padding: 10px; margin-bottom: 12px; display: none; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    const STORAGE_KEY = "ARKHAM_DOSSIER_V5_SPLIT_PARTY";
    
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      mode: "welcome", 
      activeSetupTab: "peta",
      activeMainView: "M",
      
      charCarouselIdx: 0,
      monsterCarouselIdx: 0,
      activeMapId: "map_default",
      
      data: {
        maps: [],        
        characters: [],  
        items: [],     
        monsters: []     
      },
      tokenPositions: {} 
    };

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderApp();
    }

    function renderApp() {
      const app = document.getElementById("app");
      if (state.mode === "welcome") {
        renderWelcomeScreen(app);
      } else if (state.mode === "setup") {
        renderSetupScreen(app);
      } else {
        renderMainGameplayScreen(app);
      }
    }

    function renderWelcomeScreen(app) {
      app.innerHTML = `
        <div class="header-title">ARKHAM DOSSIER</div>
        <div class="header-subtitle">CALL OF CTHULHU · SYSTEM V5</div>
        
        <div class="enigma-story-title">
          🔮 GAMES STORY OF ENIGMA 🔮
        </div>

        <div class="menu-utama-container">
          <button class="btn-utama" onclick="goToSetupManual()">✍️ BUAT STORY BARU</button>
          <hr style="border: none; border-top: 1px dashed #2d2a22; margin: 10px 0;">
          <button class="btn-secondary" onclick="loadAndEnterDemoDirectly()">⚡ MENCOBA DEMO INSTAN</button>
        </div>
      `;
    }

    function goToSetupManual() {
      state.mode = "setup";
      saveState();
    }

    function loadAndEnterDemoDirectly() {
      const m1_id = "map_arkham_gudang";
      const m2_id = "map_arkham_hutan";

      state.data = {
        maps: [
          { id: m1_id, name: "Gudang Tua Dermaga (Map A)", url: "https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?q=80&w=600" },
          { id: m2_id, name: "Hutan Ritual Terlarang (Map B)", url: "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=600" }
        ],
        characters: [
          { id: "c_p1", name: "Harvey Walters", image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=150", currentMapId: m1_id, isDead:false },
          { id: "c_p2", name: "Jenny Barnes", image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=150", currentMapId: m1_id, isDead:false },
          { id: "c_p3", name: "Prof. Armitage", image: "https://images.unsplash.com/photo-1628157582853-a796fa650a6a?q=80&w=150", currentMapId: m2_id, isDead:false }
        ],
        items: [],
        monsters: [
          { id: "m_cult", kind: "monster", name: "Dark Young", image: "https://images.unsplash.com/photo-1601987177651-8edfe6c20009?q=80&w=150", currentMapId: m2_id, isDead:false, isSpawned: true },
          { id: "m_npc_silas", kind: "npc", name: "Silas Marsh", image: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?q=80&w=150", currentMapId: m1_id, isDead:false, isSpawned: true }
        ]
      };

      state.activeMapId = m1_id;
      state.tokenPositions = {
        [m1_id]: { "c_p1": { x: 20, y: 30 }, "c_p2": { x: 80, y: 30 }, "m_npc_silas": { x: 140, y: 120 } },
        [m2_id]: { "c_p3": { x: 40, y: 50 }, "m_cult": { x: 200, y: 150 } }
      };
      
      state.mode = "main"; 
      saveState();
    }

    function renderSetupScreen(app) {
      app.innerHTML = `
        <div class="header-title" style="font-size:1.4rem; padding-top:15px;">MANAJEMEN KAMPANYE</div>
        
        <div class="tab-container">
          <div class="tab-nav ${state.activeSetupTab=='peta'?'active':''}" onclick="setSetupTab('peta')">Peta Gambar</div>
          <div class="tab-nav ${state.activeSetupTab=='karakter'?'active':''}" onclick="setSetupTab('karakter')">Karakter</div>
          <div class="tab-nav ${state.activeSetupTab=='items'?'active':''}" onclick="setSetupTab('items')">Item Game</div>
          <div class="tab-nav ${state.activeSetupTab=='monsters'?'active':''}" onclick="setSetupTab('monsters')">M/N/V</div>
        </div>
        
        <div class="content-panel">
          ${renderSetupTabContent()}
        </div>
        
        <button class="btn-start-play" onclick="enterGameplayMode()">Mulai Main ▶</button>
      `;
    }

    function renderSetupTabContent() {
      const d = state.data;
      if (state.activeSetupTab === 'peta') {
        return `
          <button class="btn-gold-outline" onclick="addMapPrompt()">+ Tambah Lokasi Peta Baru</button>
          ${d.maps.length === 0 ? '<p style="color:#555;">Belum ada peta terdaftar.</p>' : 
            d.maps.map((m,i)=>`
              <div class="box-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <span>📍 <strong>${m.name}</strong></span>
                  <button onclick="deleteData('maps',${i})" style="color:#ff5555; background:transparent; border:none; cursor:pointer;">Hapus</button>
                </div>
              </div>
            `).join('')
          }
        `;
      }
      
      if (state.activeSetupTab === 'karakter') {
        return `
          <button class="btn-gold-outline" onclick="showNewCharacterModal()">+ Daftarkan Investigator Baru</button>
          <div id="characterModalArea"></div>
          ${d.characters.length === 0 ? '<p style="color:#555;">Belum ada investigator.</p>' : 
            d.characters.map((c, i) => `<div class="box-card" style="display:flex; justify-content:space-between;"><strong>${c.name}</strong><button onclick="deleteData('characters',${i})" style="color:#ff5555; background:transparent; border:none; cursor:pointer;">Hapus</button></div>`).join('')
          }
        `;
      }

      if (state.activeSetupTab === 'items') {
        return `
          <button class="btn-gold-outline" onclick="showNewItemModal()">+ Tambah Item</button>
          <div id="itemModalArea"></div>
          ${d.items.length === 0 ? '<p style="color:#555;">Belum ada item.</p>' : 
            d.items.map((it, i) => `<div class="box-card">📦 <strong>${it.name}</strong></div>`).join('')
          }
        `;
      }

      if (state.activeSetupTab === 'monsters') {
        return `
          <button class="btn-gold-outline" onclick="showNewMonsterModal()">+ Tambah Entry M/N/V</button>
          <div id="monsterModalArea"></div>
          ${d.monsters.length === 0 ? '<p style="color:#555;">Belum ada entry.</p>' : 
            d.monsters.map((m, i) => `<div class="box-card">💀 [${m.kind.toUpperCase()}] <strong>${m.name}</strong></div>`).join('')
          }
        `;
      }
    }

    window.setSetupTab = (t) => { state.activeSetupTab = t; saveState(); };
    
    window.addMapPrompt = () => {
      const name = prompt("Masukkan nama lokasi/peta:");
      if(!name) return;
      const url = prompt("Masukkan URL Gambar Peta:");
      const id = "map_" + Date.now();
      state.data.maps.push({ id, name, url: url || "" });
      if(!state.activeMapId || state.activeMapId === "map_default") state.activeMapId = id;
      saveState();
    };

    window.deleteData = (field, idx) => { state.data[field].splice(idx,1); saveState(); };

    window.showNewCharacterModal = () => {
      document.getElementById('characterModalArea').innerHTML = `
        <div class="box-card" style="border-color:#cca54a;">
          <div class="form-group"><label>NAMA KARAKTER</label><input type="text" id="cName" class="input-field" /></div>
          <div class="form-group"><label>URL FOTO TOKEN</label><input type="text" id="cImg" class="input-field" /></div>
          <button class="bar-btn" onclick="saveFormCharacter()">Simpan</button>
        </div>`;
    };

    window.saveFormCharacter = () => {
      const name = document.getElementById('cName').value.trim();
      if(!name) return;
      const id = "c_" + Date.now();
      const defaultMapId = state.data.maps[0] ? state.data.maps[0].id : "map_default";

      state.data.characters.push({
        id, name,
        image: document.getElementById('cImg').value.trim(),
        currentMapId: defaultMapId,
        isDead: false
      });
      saveState();
    };

    window.showNewMonsterModal = () => {
      document.getElementById('monsterModalArea').innerHTML = `
        <div class="box-card" style="border-color:#cca54a;">
          <div class="form-group"><label>KIND</label><select id="mKind" class="input-field"><option value="monster">Monster</option><option value="npc">NPC</option><option value="villain">Villain</option></select></div>
          <div class="form-group"><label>NAMA ENTRY</label><input type="text" id="mName" class="input-field" /></div>
          <div class="form-group"><label>URL FOTO TOKEN</label><input type="text" id="mImg" class="input-field" /></div>
          <button class="bar-btn" onclick="saveFormMonster()">Simpan</button>
        </div>`;
    };
    window.saveFormMonster = () => {
      const name = document.getElementById('mName').value.trim();
      if(!name) return;
      const defaultMapId = state.data.maps[0] ? state.data.maps[0].id : "map_default";
      state.data.monsters.push({
        id: "m_" + Date.now(),
        kind: document.getElementById('mKind').value,
        name,
        image: document.getElementById('mImg').value.trim(),
        currentMapId: defaultMapId, 
        isDead: false,
        isSpawned: false 
      });
      saveState();
    };

    window.enterGameplayMode = () => {
      if(state.data.maps.length === 0) return alert("Daftarkan minimal satu peta gambar!");
      if(state.data.characters.length === 0) return alert("Daftarkan minimal satu investigator!");
      state.mode = "main";
      saveState();
    };

    // --- SCREEN 3: MAIN GAMEPLAY SCREEN ---
    function renderMainGameplayScreen(app) {
      app.innerHTML = `
        <div class="main-game-screen">
          <div class="sidebar-menu">
            <button class="menu-btn ${state.activeMainView==='M'?'active':''}" onclick="setMainView('M')">Peta</button>
            <button class="menu-btn ${state.activeMainView==='C'?'active':''}" onclick="setMainView('C')">Krktr</button>
            <button class="menu-btn ${state.activeMainView==='N'?'active':''}" onclick="setMainView('N')">N</button>
            <button onclick="exitToWelcome()" style="margin-top:auto; font-size:0.55rem; background:#aa3333; color:#fff; border:none; width:38px; height:36px; border-radius:4px; cursor:pointer;">KELUAR</button>
          </div>
          
          <div class="workspace">
            ${renderActiveWorkspaceView()}
          </div>
        </div>
      `;
      if(state.activeMainView === 'M') initDragAndDropEngine();
    }

    function renderActiveWorkspaceView() {
      const d = state.data;
      
      if (state.activeMainView === 'M') {
        const currentMap = d.maps.find(m => m.id === state.activeMapId) || d.maps[0] || { name: "Tanpa Peta", url: "", id: "map_default" };
        const activeInvestigators = d.characters.filter(c => c.currentMapId === currentMap.id);
        const activeMonsters = d.monsters.filter(m => m.isSpawned && m.currentMapId === currentMap.id);

        return `
          <!-- MAPS SWITCHER BERBENTUK TAB BUKAN DROPDOWN -->
          <div style="display:flex; gap:5px; margin-bottom:10px; overflow-x:auto; padding-bottom:5px;">
            ${d.maps.map(m => `
              <button class="bar-btn" style="background: ${m.id === currentMap.id ? '#cca54a' : '#1c1c19'}; color: ${m.id === currentMap.id ? '#0c0c0b' : '#cca54a'}; border: 1px solid #cca54a;" onclick="changeActiveMapGM('${m.id}')">
                📍 ${m.name}
              </button>
            `).join('')}
          </div>

          <div style="display:flex; gap:5px; margin-bottom:10px;">
            <button class="bar-btn" onclick="toggleMovementPanel('char')">⇄ Pindahkan Investigator</button>
            <button class="bar-btn" style="background:#555; color:#fff;" onclick="toggleMovementPanel('monster')">⇄ Pindahkan N/M/V</button>
          </div>

          <div id="panelMoveChar" class="movement-panel">
            <h4 style="font-size:0.75rem; color:#cca54a; margin-bottom:5px;">PILIH SIAPA YANG PINDAH MAP:</h4>
            <div class="checkbox-row">
              <input type="checkbox" id="moveAllChar" onchange="toggleSelectAllChar(this.checked)"/> 
              <label for="moveAllChar" style="color:#ffaa00; font-weight:bold;">[ Semua Pergi Bersama ]</label>
            </div>
            ${d.characters.map(c => `
              <div class="checkbox-row">
                <input type="checkbox" class="char-move-cb" value="${c.id}" id="cb_${c.id}"/> 
                <label for="cb_${c.id}">${c.name}</label>
              </div>
            `).join('')}
            <div style="margin-top:8px;">
              <select id="targetMapChar" class="bar-select">
                ${d.maps.map(m => `<option value="${m.id}">Ke: ${m.name}</option>`).join('')}
              </select>
              <button class="bar-btn" style="padding:4px 8px; margin-left:5px;" onclick="executePartySplit('char')">Pindahkan</button>
            </div>
          </div>

          <div id="panelMoveMonster" class="movement-panel" style="border-color:#ff5555;">
            <h4 style="font-size:0.75rem; color:#ff5555; margin-bottom:5px;">PILIH N/M/V YANG PINDAH MAP:</h4>
            ${d.monsters.filter(m => m.isSpawned).length === 0 ? '<p style="font-size:0.7rem; color:#666;">Tidak ada token N/M/V yang aktif.</p>' : 
              d.monsters.filter(m => m.isSpawned).map(m => `
                <div class="checkbox-row">
                  <input type="checkbox" class="monster-move-cb" value="${m.id}" id="cb_${m.id}"/> 
                  <label for="cb_${m.id}">[${m.kind[0].toUpperCase()}] ${m.name}</label>
                </div>
              `).join('')
            }
            <div style="margin-top:8px;">
              <select id="targetMapMonster" class="bar-select">
                ${d.maps.map(m => `<option value="${m.id}">Ke: ${m.name}</option>`).join('')}
              </select>
              <button class="bar-btn" style="padding:4px 8px; margin-left:5px; background:#ff5555; color:#fff;" onclick="executePartySplit('monster')">Pindahkan</button>
            </div>
          </div>

          <!-- CONTAINER PETA BERSIH TOTAL -->
          <div class="board-container" id="boardMap" style="background-image: url('${currentMap.url}');">
            ${activeInvestigators.map((c) => {
              const pos = (state.tokenPositions[currentMap.id] && state.tokenPositions[currentMap.id][c.id]) || { x: 20, y: 30 };
              return `
                <div class="token-item" style="top:${pos.y}px; left:${pos.x}px;" id="${c.id}">
                  ${c.image ? `<img src="${c.image}" draggable="false" />` : ''}
                </div>
              `;
            }).join('')}

            ${activeMonsters.map((m) => {
              const pos = (state.tokenPositions[currentMap.id] && state.tokenPositions[currentMap.id][m.id]) || { x: 150, y: 50 };
              return `
                <div class="token-item" style="top:${pos.y}px; left:${pos.x}px;" id="${m.id}">
                  ${m.image ? `<img src="${m.image}" draggable="false" />` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      if (state.activeMainView === 'C') {
        if(d.characters.length === 0) return `<p>Tidak ada karakter.</p>`;
        const c = d.characters[state.charCarouselIdx];
        const cMapName = d.maps.find(m => m.id === c.currentMapId)?.name || "Lokasi tidak diketahui";
        return `
          <div class="panel-header"><span>Investigator Profiles</span></div>
          <div class="carousel-wrapper">
            <button class="carousel-btn" onclick="rotateCarousel('char', -1)">‹</button>
            <span class="carousel-info-text">Ganti Karakter</span>
            <button class="carousel-btn" onclick="rotateCarousel('char', 1)">›</button>
          </div>
          <div class="box-card">
            <div class="char-profile-layout">
              <div class="char-photo-box">${c.image ? `<img src="${c.image}"/>` : `👤`}</div>
              <div>
                <div class="char-name-display">${c.name}</div>
                <div style="font-size:0.75rem; color:#cca54a; background:#221f18; padding:3px 6px; display:inline-block; border-radius:3px;">📍 Map: <strong>${cMapName}</strong></div>
              </div>
            </div>
          </div>
        `;
      }

      if (state.activeMainView === 'N') {
        if(d.monsters.length === 0) return `<p>Tidak ada entitas.</p>`;
        const m = d.monsters[state.monsterCarouselIdx];
        const mMapName = d.maps.find(m => m.id === m.currentMapId)?.name || "Lokasi tidak diketahui";
        return `
          <div class="panel-header"><span>Daftar Menu N</span></div>
          <div class="carousel-wrapper">
            <button class="carousel-btn" onclick="rotateCarousel('monster', -1)">‹</button>
            <span class="carousel-info-text">Tipe: ${m.kind.toUpperCase()}</span>
            <button class="carousel-btn" onclick="rotateCarousel('monster', 1)">›</button>
          </div>
          <div class="box-card">
            <h3 style="color:#ff5555;">💀 ${m.name}</h3>
            <div style="font-size:0.75rem; color:#fff; margin:5px 0 10px 0;">📍 Terdaftar di Map: <strong>${mMapName}</strong></div>
            <div style="background:#1c1a15; padding:10px; border:1px solid #cca54a; text-align:center;">
              ${m.isSpawned ? 
                `<button class="bar-btn" style="background:#aa3333; color:#fff;" onclick="toggleSpawnToken('${m.id}', false)">Tarik Dari Map</button>` : 
                `<button class="bar-btn" style="background:#33aa44; color:#fff;" onclick="toggleSpawnToken('${m.id}', true)">⚡ Spawn Token Ke Map</button>`
              }
            </div>
          </div>
        `;
      }
    }

    function initDragAndDropEngine() {
      setTimeout(() => {
        const tokens = document.querySelectorAll('.token-item');
        const board = document.getElementById('boardMap');
        if(!board) return;

        tokens.forEach(token => {
          token.onmousedown = function(event) {
            event.preventDefault();
            let shiftX = event.clientX - token.getBoundingClientRect().left;
            let shiftY = event.clientY - token.getBoundingClientRect().top;

            function moveAt(pageX, pageY) {
              let boardRect = board.getBoundingClientRect();
              let newX = pageX - boardRect.left - shiftX;
              let newY = pageY - boardRect.top - shiftY;

              newX = Math.max(0, Math.min(newX, boardRect.width - token.offsetWidth));
              newY = Math.max(0, Math.min(newY, boardRect.height - token.offsetHeight));

              token.style.left = newX + 'px';
              token.style.top = newY + 'px';

              if (!state.tokenPositions[state.activeMapId]) state.tokenPositions[state.activeMapId] = {};
              state.tokenPositions[state.activeMapId][token.id] = { x: newX, y: newY };
            }

            function onMouseMove(event) { moveAt(event.clientX, event.clientY); }
            document.addEventListener('mousemove', onMouseMove);

            document.onmouseup = function() {
              document.removeEventListener('mousemove', onMouseMove);
              document.onmouseup = null;
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            };
          };
        });
      }, 100);
    }

    window.toggleMovementPanel = (type) => {
      const charPanel = document.getElementById('panelMoveChar');
      const monsterPanel = document.getElementById('panelMoveMonster');
      if(type === 'char') {
        charPanel.style.display = charPanel.style.display === 'block' ? 'none' : 'block';
        monsterPanel.style.display = 'none';
      } else {
        monsterPanel.style.display = monsterPanel.style.display === 'block' ? 'none' : 'block';
        charPanel.style.display = 'none';
      }
    };

    window.toggleSelectAllChar = (isTrue) => {
      const checkboxes = document.querySelectorAll('.char-move-cb');
      checkboxes.forEach(cb => cb.checked = isTrue);
    };

    window.executePartySplit = (type) => {
      if(type === 'char') {
        const targetMap = document.getElementById('targetMapChar').value;
        const checkboxes = document.querySelectorAll('.char-move-cb');
        let movedCount = 0;

        checkboxes.forEach(cb => {
          if(cb.checked) {
            const charObj = state.data.characters.find(c => c.id === cb.value);
            if(charObj) {
              charObj.currentMapId = targetMap;
              if(!state.tokenPositions[targetMap]) state.tokenPositions[targetMap] = {};
              if(!state.tokenPositions[targetMap][charObj.id]) state.tokenPositions[targetMap][charObj.id] = { x: 30 + (movedCount*15), y: 40 };
              movedCount++;
            }
          }
        });
      } else {
        const targetMap = document.getElementById('targetMapMonster').value;
        const checkboxes = document.querySelectorAll('.monster-move-cb');
        let movedCount = 0;

        checkboxes.forEach(cb => {
          if(cb.checked) {
            const monObj = state.data.monsters.find(m => m.id === cb.value);
            if(monObj) {
              monObj.currentMapId = targetMap;
              if(!state.tokenPositions[targetMap]) state.tokenPositions[targetMap] = {};
              if(!state.tokenPositions[targetMap][monObj.id]) state.tokenPositions[targetMap][monObj.id] = { x: 150, y: 60 + (movedCount*15) };
              movedCount++;
            }
          }
        });
      }
      saveState();
    };

    window.changeActiveMapGM = (id) => { state.activeMapId = id; saveState(); };
    window.setMainView = (v) => { state.activeMainView = v; renderApp(); };
    window.exitToWelcome = () => { state.mode = "welcome"; saveState(); };

    window.toggleSpawnToken = (id, targetState) => {
      const m = state.data.monsters.find(x => x.id === id);
      if(m) {
        m.isSpawned = targetState;
        if(targetState) {
          if(!state.tokenPositions[m.currentMapId]) state.tokenPositions[m.currentMapId] = {};
          if(!state.tokenPositions[m.currentMapId][id]) state.tokenPositions[m.currentMapId][id] = { x: 130, y: 100 };
        }
        saveState();
      }
    };

    window.rotateCarousel = (type, direction) => {
      const d = state.data;
      if (type === 'char' && d.characters.length) state.charCarouselIdx = (state.charCarouselIdx + direction + d.characters.length) % d.characters.length;
      if (type === 'monster' && d.monsters.length) state.monsterCarouselIdx = (state.monsterCarouselIdx + direction + d.monsters.length) % d.monsters.length;
      saveState();
    };

    renderApp();
  </script>
</body>
</html>
