<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story of Enigma - CoC Companion v5</title>
  <style>
    /* --- DESIGN SYSTEM & RESET --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: #090a09; 
      color: #d4cfb8; 
      font-family: 'Courier New', Courier, monospace; 
      overflow-x: hidden;
    }
    
    .text-gold { color: #cca54a; }
    .bg-gold { background: #cca54a; color: #0c0c0b; }
    
    /* --- WELCOME SCREEN --- */
    .welcome-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 20px;
    }
    .title-banner { font-size: 2rem; font-weight: bold; color: #cca54a; letter-spacing: 4px; margin-bottom: 5px; }
    .sub-banner { font-size: 0.85rem; color: #61665a; letter-spacing: 2px; margin-bottom: 40px; }
    .btn-large {
      background: #131412; border: 1px solid #cca54a; color: #cca54a;
      padding: 15px 30px; font-size: 1rem; font-weight: bold; cursor: pointer;
      font-family: monospace; letter-spacing: 1px; width: 280px; margin: 10px;
      transition: 0.2s;
    }
    .btn-large:hover { background: #cca54a; color: #0c0c0b; }

    /* --- MODE SETUP (PORTRAIT) --- */
    .setup-container { display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 70px; }
    .tab-bar { display: flex; background: #131512; border-bottom: 1px solid #252822; }
    .tab-btn { flex: 1; padding: 12px 5px; text-align: center; color: #61665a; font-size: 0.8rem; cursor: pointer; background: none; border: none; font-family: monospace; }
    .tab-btn.active { color: #cca54a; font-weight: bold; border-bottom: 2px solid #cca54a; background: #181b17; }
    .setup-content { padding: 15px; flex: 1; }
    
    .setup-footer {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;
      background: #090a09; border-top: 1px solid #252822;
      display: flex; justify-content: space-between; align-items: center; padding: 0 15px;
      z-index: 100;
    }
    .btn-save-emoji { background: none; border: none; color: #cca54a; font-size: 1.1rem; font-weight: bold; cursor: pointer; font-family: monospace; }
    .btn-start-play { background: #cca54a; color: #090a09; border: none; padding: 8px 16px; font-weight: bold; cursor: pointer; font-family: monospace; }

    /* --- FORM STYLING --- */
    .box-card { background: #121411; border: 1px solid #252822; padding: 15px; border-radius: 4px; margin-bottom: 15px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: #cca54a; font-weight: bold; margin-bottom: 4px; }
    .input-ctrl { width: 100%; padding: 8px; background: #090a09; border: 1px solid #33382e; color: #d4cfb8; font-family: monospace; border-radius: 4px; }
    .btn-toggle-row { display: flex; gap: 5px; margin-bottom: 15px; }
    .btn-toggle { flex: 1; padding: 8px; background: #131512; border: 1px solid #33382e; color: #61665a; cursor: pointer; font-family: monospace; font-size: 0.75rem; }
    .btn-toggle.active { border-color: #cca54a; color: #cca54a; background: #181b17; font-weight: bold; }
    .attack-input-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }

    /* --- MODE MAIN (LANDSCAPE FORCE) --- */
    .main-container { display: none; width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #050505; }
    
    @media screen and (max-width: 900px) and (orientation: portrait) {
      .rotate-warning {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #090a09;
        z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 20px; color: #cca54a;
      }
      .main-layout { display: none !important; }
    }
    @media screen and (min-width: 901px), screen and (orientation: landscape) {
      .rotate-warning { display: none; }
      .main-layout { display: flex; width: 100%; height: 100%; }
    }

    .board-area { flex: 1; height: 100%; position: relative; background: #0b0c0b; overflow: auto; }
    .map-bg { width: 100%; height: 100%; object-fit: contain; pointer-events: auto; }
    .map-frozen { pointer-events: none !important; }
    
    .token-item { position: absolute; width: 50px; height: 50px; cursor: move; z-index: 50; user-select: none; touch-action: none; }
    .token-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    .token-dead img { filter: grayscale(100%); opacity: 0.5; }

    .hud-menu-triggers { position: absolute; left: 8px; top: 10px; z-index: 500; display: flex; flex-direction: column; gap: 6px; }
    .hud-btn { width: 32px; height: 32px; background: #131412; border: 1px solid #cca54a; color: #cca54a; font-weight: bold; font-family: monospace; cursor: pointer; font-size: 0.9rem; text-align: center; line-height: 30px; }
    .hud-btn.active { background: #cca54a; color: #131412; }
    .item-tab { position: absolute; left: 8px; top: 150px; z-index: 500; } 

    .hud-panel-overlay {
      position: absolute; right: 0; top: 0; width: 400px; height: calc(100% - 50px);
      background: #0d100d; border-left: 1px solid #252822; z-index: 400;
      display: none; flex-direction: column; box-shadow: -5px 0 15px rgba(0,0,0,0.5);
    }
    .panel-header { padding: 10px; background: #141814; border-bottom: 1px solid #252822; display: flex; justify-content: space-between; align-items: center; }
    .panel-body { padding: 12px; flex: 1; overflow-y: auto; }
    
    /* --- CAROUSEL DESIGN PANEL --- */
    .carousel-wrapper { display: flex; align-items: center; justify-content: space-between; background: #131512; border: 1px solid #252822; padding: 6px; margin-bottom: 12px; border-radius: 4px; }
    .carousel-arrow { background: #1c1e1b; border: 1px solid #cca54a; color: #cca54a; font-size: 1.1rem; font-weight: bold; cursor: pointer; padding: 2px 12px; border-radius: 3px; }
    .carousel-arrow:hover { background: #cca54a; color: #000; }

    .stat-card-classic {
      background: linear-gradient(135deg, #0f1c12 0%, #070d08 100%);
      border: 1px solid #27442d; padding: 12px; border-radius: 4px; margin-bottom: 12px;
    }
    .stat-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
    .stat-box-mini { background: #050805; border: 1px solid #1e3322; border-radius: 3px; text-align: center; padding: 5px 2px; position: relative; }
    .stat-label-mini { font-size: 0.6rem; color: #5a8763; display: block; text-transform: uppercase; font-weight: bold; }
    .stat-val-large { font-size: 1.2rem; font-weight: bold; color: #d4cfb8; display: block; margin: 2px 0; }
    .stat-box-btn { position: absolute; top: 0; bottom: 0; width: 18px; background: rgba(30,51,34,0.3); border: none; color: #5a8763; font-weight: bold; cursor: pointer; font-size: 0.7rem; }
    .stat-box-btn.minus { left: 0; }
    .stat-box-btn.plus { right: 0; }

    /* BAR > FOOTER INTERFACE */
    .bar-ss-footer {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 50px;
      background: #0b0d0b; border-top: 1px solid #252822; z-index: 600;
      display: flex; align-items: center; padding: 0 10px; gap: 8px;
    }
    .ss-input { background: #050605; border: 1px solid #22251f; color: #cca54a; padding: 5px; font-family: monospace; font-size: 0.75rem; border-radius: 3px; }

    .roll-card { background: #0c0d0c; border: 1px solid #2c3029; border-radius: 4px; padding: 10px; margin-top: 10px; }
    .roll-title-gold { font-size: 1rem; color: #cca54a; font-weight: bold; margin-bottom: 6px; }
    .roll-banner-result { padding: 6px; text-align: center; font-weight: bold; font-size: 0.85rem; border-radius: 3px; margin-bottom: 6px; letter-spacing: 1px; }
    .banner-success { background: #1c3d22; color: #8ce69c; border: 1px solid #2e6137; }
    .banner-fail { background: #4a1d1d; color: #f59898; border: 1px solid #732d2d; }
  </style>
</head>
<body>

  <div class="rotate-warning">
    <h3>🔄 MOHON PUTAR HP ANDA</h3>
    <p style="font-size:0.75rem; margin-top:8px; color:#61665a;">Sesi Bermain (Mode Main) mewajibkan orientasi mendatar / landscape.</p>
  </div>

  <div id="app-viewport"></div>

  <script>
    const STORAGE_KEY = "STORY_ENIGMA_DATA_2026_V5"; // Key diubah agar fresh

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      mode: "welcome", 
      setupTab: "peta",
      activeHudMenu: null, 
      carouselIdx: { character: 0, sanity: 0, item: 0, threat: 0 },
      data: {
        maps: [{ id: "m1", name: "Gedung Tua Miskatonic", url: "https://images.unsplash.com/photo-1578328819058-b69f3a3b0f6b?q=80&w=1000&auto=format&fit=crop" }],
        characters: [{ id: "c1", name: "Prof. Armitage", image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=150&auto=format&fit=crop", bio: "Seorang peneliti senior.", skills: [{name: "Mitos Cthulhu", value: 5}], status: { hp: 10, hp_max: 10, sanity: 8, sanity_max: 12, mp: 8, mp_max: 8, luck: 11, luck_max: 12 }, weapons: [], conditions: [], logs: [] }],
        items: [],
        monsters: [] 
      },
      tokens: {}, 
      selectedMapId: "m1",
      rollLogs: []
    };

    function syncStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

    function computeRoll2D6(targetSkill, diceResult) {
      if (diceResult === 2) return { status: "SUKSES KRITIS", css: "banner-success" };
      if (diceResult === 12) return { status: "GAGAL TOTAL (FUMBLE)", css: "banner-fail" };
      if (diceResult <= targetSkill) {
        if (diceResult <= Math.floor(targetSkill / 3)) return { status: "SUKSES EKSTREM", css: "banner-success" };
        if (diceResult <= Math.floor(targetSkill / 2)) return { status: "SUKSES SULIT", css: "banner-success" };
        return { status: "BERHASIL", css: "banner-success" };
      }
      return { status: "GAGAL", css: "banner-fail" };
    }

    function setMode(targetMode) { state.mode = targetMode; state.activeHudMenu = null; syncStorage(); renderEngine(); }
    function setSetupTab(tabName) { state.setupTab = tabName; renderEngine(); }
    function saveStateManual() { syncStorage(); alert("Data Disimpan!"); }

    function addMap() {
      let name = prompt("Nama Peta:"); let url = prompt("URL Gambar:");
      if (name && url) { state.data.maps.push({ id: "m_" + Date.now(), name, url }); syncStorage(); renderEngine(); }
    }

    function addCharacter() {
      let name = prompt("Nama Investigator:"); let url = prompt("URL Foto Profil:"); let bio = prompt("Cerita Investigator:");
      if (!name) return;
      state.data.characters.push({
        id: "c_" + Date.now(), name, image: url || "https://via.placeholder.com/150", bio: bio || "", skills: [],
        status: { hp: 10, hp_max: 10, sanity: 12, sanity_max: 12, mp: 10, mp_max: 10, luck: 10, luck_max: 12 },
        weapons: [], conditions: [], logs: []
      });
      syncStorage(); renderEngine();
    }

    function addItem() {
      let name = prompt("Nama Item:"); let type = prompt("Kategori:", "buku"); let desc = prompt("Cerita Item:");
      if (name) { state.data.items.push({ id: "i_" + Date.now(), name, type, deskripsi: desc || "" }); syncStorage(); renderEngine(); }
    }

    let setupKindN = "monster";
    function changeSetupKindN(kind) { setupKindN = kind; renderEngine(); }

    function saveNewEntityN() {
      let name = document.getElementById("n_name").value.trim();
      let img = document.getElementById("n_img").value.trim() || "https://via.placeholder.com/150";
      let desc = document.getElementById("n_desc").value.trim();
      if (!name) return alert("Nama wajib diisi!");

      let newEnt = { id: "n_" + Date.now(), name, image: img, description: desc, kind: setupKindN, isDead: false };
      if (setupKindN !== "npc") {
        let hpVal = parseInt(document.getElementById("n_hp").value) || 10;
        newEnt.hp = { cur: hpVal, max: hpVal }; newEnt.attacks = [];
        let maxLoop = setupKindN === "monster" ? 3 : 4;
        for (let i = 1; i <= maxLoop; i++) {
          let attName = document.getElementById(`att_name_${i}`).value.trim();
          let attTarget = parseInt(document.getElementById(`att_target_${i}`).value) || 6;
          if (attName) newEnt.attacks.push({ id: "a_" + i, name: attName, value: attTarget });
        }
      }
      if (setupKindN === "villain") newEnt.weapons = [];
      state.data.monsters.push(newEnt); syncStorage(); alert("Ancaman Disimpan!"); renderEngine();
    }

    function toggleDeathOverride(type, id) {
      let ent = type === 'char' ? state.data.characters.find(c => c.id === id) : state.data.monsters.find(m => m.id === id);
      if (!ent) return;
      ent.isDead = !ent.isDead; if(ent.hp) ent.hp.cur = ent.isDead ? 0 : ent.hp.max;
      syncStorage(); renderEngine();
    }

    function addNewSkill(charId) {
      let c = state.data.characters.find(x => x.id === charId);
      let sName = prompt("Nama Skill Baru:");
      let sVal = parseInt(prompt("Nilai Target Keberhasilan (2-12):", "6"));
      if(c && sName && !isNaN(sVal)) { c.skills.push({ name: sName, value: sVal }); syncStorage(); renderEngine(); }
    }

    function appendWeaponEntity(type, entId) {
      let ent = type === 'char' ? state.data.characters.find(c => c.id === entId) : state.data.monsters.find(m => m.id === entId);
      let wName = prompt("Nama Senjata:"); let wType = prompt("Tipe (melee/firearm):", "firearm");
      if (!wName) return;
      let maxCap = parseInt(prompt("Kapasitas Peluru / Durabilitas Maksimal:", "6")) || 6;
      if (!ent.weapons) ent.weapons = [];
      ent.weapons.push({ id: "w_" + Date.now(), name: wName, type: wType, durability: { cur: maxCap, max: maxCap } });
      syncStorage(); renderEngine();
    }

    function moveCarousel(key, dir, maxLen) {
      if (maxLen <= 0) return;
      state.carouselIdx[key] = (state.carouselIdx[key] + dir + maxLen) % maxLen;
      renderEngine();
    }

    function changeStat(charId, statField, amt) {
      let c = state.data.characters.find(x => x.id === charId); if (!c) return;
      c.status[statField] = Math.max(0, Math.min(c.status[statField + "_max"], c.status[statField] + amt));
      if (statField === 'hp' && c.status.hp === 0) c.isDead = true;
      syncStorage(); renderEngine();
    }

    function triggerSanityFormula(charId, formulaName) {
      let resultStr = prompt(`[SANITY] Hasil dadu fisik pengurangan untuk formula ${formulaName}:`);
      let dmg = parseInt(resultStr); if (isNaN(dmg) || dmg < 0) return;
      let c = state.data.characters.find(x => x.id === charId);
      if (c) { 
        c.status.sanity = Math.max(0, c.status.sanity - dmg); 
        alert(`Sanity ${c.name} berkurang ${dmg} poin!`);
        syncStorage(); renderEngine(); 
      }
    }

    // --- FUNGSI KHUSUS UNTUK SANITY CHECK DI MENU S ---
    function processSanityCheck(charId) {
      let c = state.data.characters.find(x => x.id === charId);
      if (!c) return;
      
      let inputElem = document.getElementById("san_dice_result_" + charId);
      let diceResult = parseInt(inputElem.value);
      
      if (isNaN(diceResult) || diceResult < 2 || diceResult > 12) {
        return alert("Masukkan hasil kocokan dadu 2D6 fisik (2-12) pada kolom Sanity Check!");
      }

      let targetValue = c.status.sanity; // Nilai sanity saat ini jadi target lulus
      let evalRes = computeRoll2D6(targetValue, diceResult);
      
      // Override status karena sanity check punya nuansa sendiri
      let sanStatus = diceResult <= targetValue ? "BERHASIL KEWARASAN" : "GAGAL KEWARASAN (SHOCK)";
      
      state.rollLogs.unshift({ 
        entityName: c.name, 
        actionName: "Sanity Check (Uji Mental)", 
        targetSkill: targetValue, 
        diceResult: diceResult, 
        status: sanStatus, 
        cssClass: evalRes.css 
      });
      
      inputElem.value = ""; // Reset input
      syncStorage(); 
      renderEngine();
    }

    function syncRollSourceOptions() {
      let src = document.getElementById("ss_source")?.value;
      let subSelect = document.getElementById("ss_sub_target");
      if (!subSelect) return; subSelect.innerHTML = "";

      if (src === "investigator_skill") {
        state.data.characters.forEach(c => {
          c.skills.forEach(s => {
            subSelect.innerHTML += `<option value="c_skill:${c.id}:${s.name}:${s.value}">👤 ${c.name} - ${s.name} (${s.value})</option>`;
          });
        });
      } else if (src === "investigator_weapon") {
        state.data.characters.forEach(c => {
          c.weapons?.forEach(w => {
            subSelect.innerHTML += `<option value="c_weapon:${c.id}:${w.id}:${w.name}">⚔️ ${c.name} - ${w.name} (Sisa: ${w.durability.cur})</option>`;
          });
        });
      } else if (src === "monster_attack") {
        state.data.monsters.filter(m => m.kind !== "npc").forEach(m => {
          m.attacks?.forEach(a => {
            subSelect.innerHTML += `<option value="m_atk:${m.id}:${a.name}:${a.value}">👹 [${m.kind.toUpperCase()}] ${m.name} - ${a.name} (${a.value})</option>`;
          });
        });
      } else if (src === "villain_weapon") {
        state.data.monsters.filter(m => m.kind === "villain").forEach(v => {
          v.weapons?.forEach(w => {
            subSelect.innerHTML += `<option value="v_weapon:${v.id}:${w.id}:${w.name}">☠️ ${v.name} - ${w.name} (Sisa: ${w.durability.cur})</option>`;
          });
        });
      }
    }

    function processRollFromBarSS() {
      let src = document.getElementById("ss_source").value;
      let subVal = document.getElementById("ss_sub_target").value;
      let manualTarget = parseInt(document.getElementById("ss_target_manual").value) || 6;
      let diceResult = parseInt(document.getElementById("ss_dice_result").value);

      if (isNaN(diceResult) || diceResult < 2 || diceResult > 12) return alert("Masukkan hasil kocokan dadu 2D6 fisik (2-12) di Bar Bawah!");

      let entityName = "Sistem";
      let actionName = "Tes Manual";
      let targetValue = manualTarget;

      if (subVal) {
        let tokens = subVal.split(":");
        let category = tokens[0];

        if (category === "c_skill") {
          let c = state.data.characters.find(x => x.id === tokens[1]);
          entityName = c ? c.name : "Investigator";
          actionName = `Gunakan Skill: ${tokens[2]}`;
          targetValue = parseInt(tokens[3]);
        } 
        else if (category === "c_weapon") {
          let c = state.data.characters.find(x => x.id === tokens[1]);
          let wp = c?.weapons?.find(w => w.id === tokens[2]);
          entityName = c ? c.name : "Investigator";
          actionName = `Menembak/Menyerang: ${tokens[3]}`;
          targetValue = 6;
          if (wp) {
            wp.durability.cur = Math.max(0, wp.durability.cur - 1);
            alert(`[AMUNISI] ${wp.name} berkurang 1 pemakaian.`);
          }
        } 
        else if (category === "m_atk") {
          let m = state.data.monsters.find(x => x.id === tokens[1]);
          entityName = m ? m.name : "Monster";
          actionName = `Serangan: ${tokens[2]}`;
          targetValue = parseInt(tokens[3]);
        } 
        else if (category === "v_weapon") {
          let v = state.data.monsters.find(x => x.id === tokens[1]);
          let wp = v?.weapons?.find(w => w.id === tokens[2]);
          entityName = v ? v.name : "Villain";
          actionName = `Menembak Senjata: ${tokens[3]}`;
          targetValue = 6;
          if (wp) {
            wp.durability.cur = Math.max(0, wp.durability.cur - 1);
            alert(`[AMUNISI] Senjata Villain ${wp.name} berkurang 1.`);
          }
        }
      }

      let evalRes = computeRoll2D6(targetValue, diceResult);
      state.rollLogs.unshift({ 
        entityName, 
        actionName, 
        targetSkill: targetValue, 
        diceResult, 
        status: evalRes.status, 
        cssClass: evalRes.css 
      });
      
      document.getElementById("ss_dice_result").value = "";
      syncStorage(); 
      renderEngine();
    }

    let currentDraggedTokenId = null;
    function handleTokenDragStart(e, id) { currentDraggedTokenId = id; }
    function handleBoardDragOver(e) { e.preventDefault(); }
    function handleBoardDrop(e) {
      e.preventDefault(); if (!currentDraggedTokenId) return;
      let rect = document.getElementById("game-board-area").getBoundingClientRect();
      state.tokens[currentDraggedTokenId] = { x: e.clientX - rect.left - 25, y: e.clientY - rect.top - 25, mapId: state.selectedMapId };
      currentDraggedTokenId = null; syncStorage(); renderEngine();
    }
    function removeTokenFromBoard(id) { delete state.tokens[id]; syncStorage(); renderEngine(); }
    function toggleHudMenu(menuLetter) { state.activeHudMenu = (state.activeHudMenu === menuLetter) ? null : menuLetter; renderEngine(); }
    function deployToken(id) { state.tokens[id] = { x: 150, y: 150, mapId: state.selectedMapId }; state.activeHudMenu = null; syncStorage(); renderEngine(); }

    function renderEngine() {
      const view = document.getElementById("app-viewport");
      if (state.mode === "welcome") {
        view.innerHTML = `<div class="welcome-screen"><div class="title-banner">STORY OF ENIGMA</div><button class="btn-large" onclick="setMode('setup')">🔮 SETUP STORY</button><button class="btn-large" onclick="setMode('main')">▶ MULAI MAIN</button></div>`;
        return;
      }
      if (state.mode === "setup") {
        let tabContentHtml = "";
        if (state.setupTab === "peta") {
          tabContentHtml = `<button class="btn-large" style="width:100%; margin-bottom:15px;" onclick="addMap()">+ Tambah Peta</button>${state.data.maps.map(m => `<div class="box-card">🗺️ ${m.name}</div>`).join('')}`;
        } else if (state.setupTab === "karakter") {
          tabContentHtml = `<button class="btn-large" style="width:100%; margin-bottom:15px;" onclick="addCharacter()">+ Tambah Investigator</button>${state.data.characters.map(c => `<div class="box-card">👤 ${c.name}</div>`).join('')}`;
        } else if (state.setupTab === "monsters") {
          tabContentHtml = `
            <div class="box-card">
              <div class="btn-toggle-row">
                <button class="btn-toggle ${setupKindN==='monster'?'active':''}" onclick="changeSetupKindN('monster')">MONSTER</button>
                <button class="btn-toggle ${setupKindN==='npc'?'active':''}" onclick="changeSetupKindN('npc')">NPC</button>
                <button class="btn-toggle ${setupKindN==='villain'?'active':''}" onclick="changeSetupKindN('villain')">VILLAIN</button>
              </div>
              <div class="form-group"><label>NAMA</label><input id="n_name" type="text" class="input-ctrl"></div>
              <div class="form-group"><label>URL TOKEN</label><input id="n_img" type="text" class="input-ctrl"></div>
              <div class="form-group"><label>CERITA</label><input id="n_desc" type="text" class="input-ctrl"></div>
              ${setupKindN !== 'npc' ? `
                <div class="form-group"><label>HP</label><input id="n_hp" type="number" class="input-ctrl" value="10"></div>
                <label style="font-size:0.75rem; color:#cca54a;">SERANGAN BRUTAL (Max ${setupKindN==='monster'?3:4})</label>
                ${[1,2,3,4].map(i => (setupKindN==='monster' && i>3) ? '' : `
                  <div class="attack-input-row">
                    <input id="att_name_${i}" type="text" class="input-ctrl" placeholder="Nama Serangan" style="flex:2;">
                    <input id="att_target_${i}" type="number" class="input-ctrl" placeholder="Target 2-12" style="flex:1;">
                  </div>
                `).join('')}
              ` : ''}
              <button class="btn-start-play" style="width:100%; margin-top:10px;" onclick="saveNewEntityN()">Simpan Ancaman</button>
            </div>`;
        } else if (state.setupTab === "item") {
          tabContentHtml = `<button class="btn-large" style="width:100%; margin-bottom:15px;" onclick="addItem()">+ Tambah Item</button>${state.data.items.map(i => `<div class="box-card">📦 ${i.name}</div>`).join('')}`;
        }
        view.innerHTML = `<div class="setup-container"><div class="tab-bar"><button class="tab-btn ${state.setupTab==='peta'?'active':''}" onclick="setSetupTab('peta')">Peta</button><button class="tab-btn ${state.setupTab==='karakter'?'active':''}" onclick="setSetupTab('karakter')">Investigator</button><button class="tab-btn ${state.setupTab==='monsters'?'active':''}" onclick="setSetupTab('monsters')">Ancaman</button><button class="tab-btn ${state.setupTab==='item'?'active':''}" onclick="setSetupTab('item')">Item</button></div><div class="setup-content">${tabContentHtml}</div><div class="setup-footer"><button class="btn-save-emoji" onclick="saveStateManual()">SIMPAN</button><button class="btn-start-play" onclick="setMode('main')">Main ▶</button></div></div>`;
        return;
      }

      if (state.mode === "main") {
        let activeMap = state.data.maps.find(m => m.id === state.selectedMapId) || state.data.maps[0];
        let isFrozen = state.activeHudMenu !== null ? "map-frozen" : "";
        let overlayContentHtml = "";
        
        if (state.activeHudMenu === 'C') {
          let cList = state.data.characters; let idx = state.carouselIdx.character; let c = cList[idx];
          overlayContentHtml = `
            <div class="panel-header"><h4>MENU C - INVESTIGATOR PROFIL</h4><button onclick="toggleHudMenu(null)">❌</button></div>
            <div class="panel-body">
              ${cList.length === 0 ? '<p>Kosong</p>' : `
                <div class="carousel-wrapper">
                  <button class="carousel-arrow" onclick="moveCarousel('character',-1,${cList.length})">‹</button>
                  <strong class="text-gold">${c.name} (${idx+1}/${cList.length})</strong>
                  <button class="carousel-arrow" onclick="moveCarousel('character',1,${cList.length})">›</button>
                </div>
                <div style="text-align:center;"><img src="${c.image}" style="width:110px; height:110px; object-fit:cover; border-radius:4px; border:1px solid #cca54a;"></div>
                <p style="font-size:0.75rem; margin-top:10px; background:#000; padding:10px; border-radius:4px; line-height:1.4;"><strong>CERITA LATAR BELAKANG:</strong><br>${c.bio}</p>
              `}
            </div>`;
        }
        else if (state.activeHudMenu === 'S') {
          let cList = state.data.characters; let idx = state.carouselIdx.sanity; let c = cList[idx];
          overlayContentHtml = `
            <div class="panel-header"><h4>MENU S - STATUS CARD & SKILLS</h4><button onclick="toggleHudMenu(null)">❌</button></div>
            <div class="panel-body">
              ${cList.length === 0 ? '<p>Kosong</p>' : `
                <div class="carousel-wrapper">
                  <button class="carousel-arrow" onclick="moveCarousel('sanity',-1,${cList.length})">‹</button>
                  <strong class="text-gold">${c.name}</strong>
                  <button class="carousel-arrow" onclick="moveCarousel('sanity',1,${cList.length})">›</button>
                </div>
                <div class="stat-card-classic">
                  <div class="stat-grid-4">
                    <div class="stat-box-mini"><button class="stat-box-btn minus" onclick="changeStat('${c.id}','hp',-1)">-</button><span class="stat-label-mini">HP</span><span class="stat-val-large">${c.status.hp}</span><button class="stat-box-btn plus" onclick="changeStat('${c.id}','hp',1)">+</button></div>
                    <div class="stat-box-mini"><button class="stat-box-btn minus" onclick="changeStat('${c.id}','sanity',-1)">-</button><span class="stat-label-mini">SAN</span><span class="stat-val-large">${c.status.sanity}</span><button class="stat-box-btn plus" onclick="changeStat('${c.id}','sanity',1)">+</button></div>
                    <div class="stat-box-mini"><button class="stat-box-btn minus" onclick="changeStat('${c.id}','mp',-1)">-</button><span class="stat-label-mini">MP</span><span class="stat-val-large">${c.status.mp}</span><button class="stat-box-btn plus" onclick="changeStat('${c.id}','mp',1)">+</button></div>
                    <div class="stat-box-mini"><button class="stat-box-btn minus" onclick="changeStat('${c.id}','luck',-1)">-</button><span class="stat-label-mini">LCK</span><span class="stat-val-large">${c.status.luck}</span><button class="stat-box-btn plus" onclick="changeStat('${c.id}','luck',1)">+</button></div>
                  </div>

                  <!-- AREA SANITY CHECK KHUSUS -->
                  <div style="margin-top:12px; border-top:1px dashed #27442d; padding-top:8px;">
                    <span class="stat-label-mini" style="margin-bottom:4px; display:block;">SANITY CHECK (UJI KEWARASAN):</span>
                    <div style="display:flex; gap:5px; align-items:center;">
                      <input id="san_dice_result_${c.id}" type="number" class="input-ctrl" style="width:70px; padding:6px; font-size:0.75rem;" placeholder="2D6">
                      <button onclick="processSanityCheck('${c.id}')" style="background:#5a8763; color:#000; border:none; padding:6px 12px; font-weight:bold; font-size:0.7rem; cursor:pointer; border-radius:3px;">ROLL SAN CHECK</button>
                    </div>
                    <p style="font-size:0.6rem; color:#61665a; margin-top:4px;">Berhasil jika dadu <= nilai SAN saat ini (${c.status.sanity}). Jika gagal, kurangi instan di bawah ini:</p>
                  </div>

                  <div style="margin-top:8px;"><span class="stat-label-mini">HITUNG SANITY INSTAN:</span>
                    <div style="display:grid; grid-template-columns:repeat(6,1fr); gap:2px; margin-top:3px;">
                      ${['1D2','1D3','1D4','1D6','1D8','1D10'].map(f => `<button onclick="triggerSanityFormula('${c.id}','${f}')" style="font-size:0.55rem; background:#1c3322; color:#fff; border:none; padding:4px 0; cursor:pointer;">${f}</button>`).join('')}
                    </div>
                  </div>
                  
                  <!-- PENGELOLAAN SKILL KARAKTER -->
                  <div style="margin-top:12px; border-top:1px dashed #27442d; padding-top:8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                      <span class="stat-label-mini">DAFTAR SKILL INVESTIGATOR:</span>
                      <button onclick="addNewSkill('${c.id}')" style="font-size:0.6rem; background:#222; color:#cca54a; border:1px solid #444; padding:2px 4px;">[+ Tambah Skill]</button>
                    </div>
                    ${c.skills.map(s => `<div style="font-size:0.7rem; background:#050805; padding:3px; margin:2px 0; border:1px solid #111;">• ${s.name} (Target Kelulusan: ${s.value})</div>`).join('')}
                  </div>

                  <!-- PENGELOLAAN SENJATA KARAKTER -->
                  <div style="margin-top:12px; border-top:1px dashed #27442d; padding-top:8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                      <span class="stat-label-mini">GUDANG SENJATA:</span>
                      <button onclick="appendWeaponEntity('char','${c.id}')" style="font-size:0.6rem; background:#222; color:#cca54a; border:1px solid #444; padding:2px 4px;">[+ Tambah Senjata]</button>
                    </div>
                    ${c.weapons?.map(w => `<div style="font-size:0.7rem; background:#050805; padding:3px; margin:2px 0;">⚔️ ${w.name} (${w.type}) — Amunisi/Durabilitas: <strong>${w.durability.cur}/${w.durability.max}</strong></div>`).join('')}
                  </div>
                </div>
              `}
            </div>`;
        }
        else if (state.activeHudMenu === 'N') {
          let nList = state.data.monsters; let idx = state.carouselIdx.threat; let n = nList[idx];
          overlayContentHtml = `
            <div class="panel-header"><h4>MENU N - ANCAMAN</h4><button onclick="toggleHudMenu(null)">❌</button></div>
            <div class="panel-body">
              ${nList.length === 0 ? '<p>Kosong</p>' : `
                <div class="carousel-wrapper">
                  <button class="carousel-arrow" onclick="moveCarousel('threat',-1,${nList.length})">‹</button>
                  <strong class="text-gold">[${n.kind.toUpperCase()}] ${n.name} (${idx+1}/${nList.length})</strong>
                  <button class="carousel-arrow" onclick="moveCarousel('threat',1,${nList.length})">›</button>
                </div>
                <div class="stat-card-classic">
                  <p style="font-size:0.75rem; margin-bottom:8px;"><strong>CERITA KRONOLOGI:</strong><br>${n.description}</p>
                  ${n.hp ? `<div style="font-size:0.75rem; margin-bottom:8px;">🩸 SISA HP: <strong>${n.hp.cur} / ${n.hp.max}</strong></div>` : ''}
                  
                  ${n.attacks ? `
                    <div style="font-size:0.7rem; color:#cca54a; margin-top:5px;">💥 DAFTAR SERANGAN BAWAAN:
                      ${n.attacks.map(a => `<div style="background:#000; padding:3px; margin:2px 0;">• ${a.name} (Nilai Target: ${a.value})</div>`).join('')}
                    </div>` : ''}

                  ${n.kind === 'villain' ? `
                    <div style="margin-top:10px; border-top:1px dashed #aa3333; padding-top:6px;"><span class="stat-label-mini">SENJATA KANON VILLAIN:</span> <button onclick="appendWeaponEntity('monster','${n.id}')" style="font-size:0.6rem;">[+ Senjata]</button>
                      ${n.weapons?.map(w => `<div style="font-size:0.7rem; background:#000; padding:3px; margin:2px 0;">☠️ ${w.name} — Durabilitas: ${w.durability.cur}/${w.durability.max}</div>`).join('')}
                    </div>` : ''}
                </div>
              `}
            </div>`;
        }
        else if (state.activeHudMenu === 'M') {
          overlayContentHtml = `
            <div class="panel-header"><h4>MENU M - LOKASI PETA</h4><button onclick="toggleHudMenu(null)">❌</button></div>
            <div class="panel-body">
              <select class="input-ctrl" onchange="state.selectedMapId=this.value; renderEngine();">
                ${state.data.maps.map(m => `<option value="${m.id}" ${state.selectedMapId===m.id?'selected':''}>${m.name}</option>`).join('')}
              </select>
              <div style="margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:4px;">
                ${state.data.characters.map(c => `<button class="btn-toggle" onclick="deployToken('${c.id}')">👤 ${c.name}</button>`).join('')}
                ${state.data.monsters.map(m => `<button class="btn-toggle" onclick="deployToken('${m.id}')">👹 ${m.name}</button>`).join('')}
              </div>
            </div>`;
        }
        else if (state.activeHudMenu === 'I') {
          let items = state.data.items; let idx = state.carouselIdx.item; let activeItem = items[idx];
          overlayContentHtml = `
            <div class="panel-header"><h4>MENU I - ARSIP ITEM</h4><button onclick="toggleHudMenu(null)">❌</button></div>
            <div class="panel-body">
              ${items.length === 0 ? '<p>Kosong</p>' : `
                <div class="carousel-wrapper">
                  <button class="carousel-arrow" onclick="moveCarousel('item',-1,${items.length})">‹</button>
                  <strong class="text-gold">${activeItem.name}</strong>
                  <button class="carousel-arrow" onclick="moveCarousel('item',1,${items.length})">›</button>
                </div>
                <p style="font-size:0.75rem;">${activeItem.deskripsi}</p>
              `}
            </div>`;
        }

        view.innerHTML = `
          <div class="main-container" style="display:block;">
            <div class="main-layout">
              <div class="board-area" id="game-board-area" ondragover="handleBoardDragOver(event)" ondrop="handleBoardDrop(event)">
                <img src="${activeMap?.url}" class="map-bg ${isFrozen}" draggable="false">
                ${Object.keys(state.tokens).map(id => {
                  let tok = state.tokens[id]; if (tok.mapId !== state.selectedMapId) return '';
                  let found = state.data.characters.find(c => c.id === id) || state.data.monsters.find(m => m.id === id);
                  if(!found) return '';
                  return `<div class="token-item ${found.isDead?'token-dead':''}" id="tok_${id}" style="left:${tok.x}px; top:${tok.y}px;" draggable="true" ondragstart="handleTokenDragStart(event, '${id}')" oncontextmenu="event.preventDefault(); removeTokenFromBoard('${id}')"><img src="${found.image}"></div>`;
                }).join('')}
              </div>

              <div class="hud-menu-triggers">
                <button class="hud-btn ${state.activeHudMenu=='M'?'active':''}" onclick="toggleHudMenu('M')">M</button>
                <button class="hud-btn ${state.activeHudMenu=='C'?'active':''}" onclick="toggleHudMenu('C')">C</button>
                <button class="hud-btn ${state.activeHudMenu=='S'?'active':''}" onclick="toggleHudMenu('S')">S</button>
                <button class="hud-btn ${state.activeHudMenu=='N'?'active':''}" onclick="toggleHudMenu('N')">N</button>
              </div>
              <button class="hud-btn item-tab ${state.activeHudMenu=='I'?'active':''}" onclick="toggleHudMenu('I')">I</button>

              <div class="hud-panel-overlay" style="display:${state.activeHudMenu?'flex':'none'};">${overlayContentHtml}</div>

              ${state.activeHudMenu === null ? `
                <div style="position:absolute; right:10px; top:10px; width:250px; max-height:calc(100% - 70px); overflow-y:auto; z-index:100;">
                  ${state.rollLogs.slice(0,4).map(log => `<div class="roll-card"><div class="roll-title-gold">${log.entityName}</div><div class="roll-banner-result ${log.cssClass}">${log.status} (${log.diceResult}/${log.targetSkill})</div></div>`).join('')}
                </div>
              ` : ''}

              <!-- TAB BAR UTAMA -->
              <div class="bar-ss-footer">
                <span style="font-size:1.2rem; color:#cca54a; font-weight:bold; padding-right:3px;">&gt;</span>
                
                <select id="ss_source" class="ss-input" onchange="syncRollSourceOptions()">
                  <option value="manual">-- Pilih Kategori Aksi --</option>
                  <option value="investigator_skill">1. Skill Investigator</option>
                  <option value="investigator_weapon">2. Senjata Investigator</option>
                  <option value="monster_attack">3. Serangan Monster</option>
                  <option value="villain_weapon">4. Senjata Villain</option>
                </select>

                <select id="ss_sub_target" class="ss-input" style="max-width:220px;"></select>
                
                <input id="ss_target_manual" type="number" class="ss-input" style="width:50px;" value="6" placeholder="Tgt">
                <input id="ss_dice_result" type="number" class="ss-input" style="width:70px;" placeholder="2D6">
                
                <button onclick="processRollFromBarSS()" style="background:#cca54a; color:#000; border:none; padding:5px 12px; font-weight:bold; font-size:0.7rem; cursor:pointer;">SUBMIT</button>
                
                <div style="margin-left:auto; display:flex; gap:4px;">
                  <button onclick="saveStateManual()" style="background:none; border:1px solid #cca54a; color:#cca54a; font-size:0.6rem; padding:3px;">SAVE</button>
                  <button onclick="setMode('setup')" style="background:#541616; color:#fff; border:none; font-size:0.6rem; padding:3px;">SETUP</button>
                </div>
              </div>
            </div>
          </div>
        `;
        syncRollSourceOptions();
      }
    }

    renderEngine();
  </script>
</body>
</html>
