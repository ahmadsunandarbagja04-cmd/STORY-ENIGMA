<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STORY ENIGMA - Full Feature Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #e0e0e0; font-family: Arial, sans-serif; overflow-x: hidden; }
    #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    
    /* OPENING SCREEN */
    .opening-container { max-width: 500px; margin: 40px auto; padding: 20px; text-align: center; }
    .title { font-size: 2.5rem; color: #ffd700; letter-spacing: 2px; margin-bottom: 5px; }
    .subtitle { font-size: 1rem; color: #888; margin-bottom: 30px; }
    .section { margin-bottom: 30px; }
    .list-container { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .story-button { padding: 15px; background: #1a2e1a; border: 1px solid #2d5a2d; border-radius: 6px; color: #fff; text-align: left; font-size: 1rem; cursor: pointer; display: flex; justify-content: space-between; }
    .main-action-btn { width: 100%; padding: 12px; background: #2d5a2d; border: none; border-radius: 6px; color: #fff; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    .form-box { background: #1c1c1c; padding: 20px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; text-align: left; }
    .input-text { padding: 10px; background: #111; border: 1px solid #444; border-radius: 4px; color: #fff; font-size: 0.9rem; width: 100%; }
    .input-row { display: flex; gap: 10px; }

    /* SETUP MODE (PORTRAIT) */
    .setup-container { display: flex; flex-direction: column; height: 100vh; padding: 10px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .back-btn { background: #333; border: none; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .tab-bar { display: flex; gap: 5px; margin: 10px 0; overflow-x: auto; }
    .tab-btn { flex: 1; padding: 10px; background: #1e1e1e; border: 1px solid #333; color: #aaa; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: #2d5a2d; color: #fff; border: 1px solid #55a855; }
    .setup-content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
    .setup-card { background: #1c1c1c; border: 1px solid #333; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .del-btn { background: #aa3333; border: none; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    
    /* FOOTER */
    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #1a1a1a; border-top: 1px solid #333; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 100; }
    .start-btn { background: #2d5a2d; border: none; color: #fff; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; }

    /* MAIN MODE */
    .main-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
    @media screen and (max-width: 768px) and (orientation: portrait) {
      .main-container { transform: rotate(90deg); transform-origin: bottom left; position: absolute; top: -100vw; left: 0; width: 100vh; height: 100vw; }
    }
    .map-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: flex; justify-content: center; align-items: center; background: #111; }
    .map-layer.frozen { pointer-events: none; filter: brightness(0.2) blur(3px); }
    
    .fixed-menu-btn { position: absolute; z-index: 10; width: 34px; height: 34px; background: #1c1c1c; border: 1px solid #ffd700; color: #ffd700; font-weight: bold; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .fixed-menu-btn.active { background: #ffd700; color: #1c1c1c; }
    .popover-panel { position: absolute; top: 10px; left: 60px; right: 10px; bottom: 75px; background: rgba(15, 15, 15, 0.98); border: 2px solid #ffd700; border-radius: 8px; z-index: 20; padding: 15px; overflow-y: auto; }
    .popover-header { display: flex; justify-content: space-between; border-bottom: 1px solid #ffd700; padding-bottom: 5px; margin-bottom: 15px; }
    
    .stat-card-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
    .coc-stat-box { background: linear-gradient(135deg, #0f2613 0%, #071409 100%); border: 1px solid #2d5a2d; border-radius: 6px; padding: 8px; min-width: 80px; text-align: center; }
    .coc-label { display: block; font-size: 0.65rem; color: #8cd98c; margin-bottom: 4px; }
    .coc-num-row { display: flex; justify-content: space-between; align-items: center; }
    .coc-btn { background: #1c3d20; border: none; color: #fff; width: 18px; height: 18px; border-radius: 3px; cursor: pointer; font-weight: bold; }
    .coc-number { font-size: 1.3rem; font-weight: bold; color: #fff; }

    /* BAR SS & LOGS */
    .bar-ss { position: absolute; bottom: 0; left: 0; right: 0; height: 65px; background: #141414; border-top: 2px solid #333; z-index: 15; display: flex; align-items: center; padding: 0 10px; gap: 8px; overflow-x: auto; }
    .ss-select, .ss-input { background: #222; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; font-size: 0.8rem; }
    .ss-input-num { width: 50px; text-align: center; font-weight: bold; color: #ffd700; }
    .ss-btn { background: #2d5a2d; border: none; color: #fff; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .log-panel { margin-top: 15px; background: #111; padding: 10px; border-radius: 6px; max-height: 200px; overflow-y: auto; }
    .log-item { font-family: monospace; font-size: 0.8rem; border-bottom: 1px solid #222; padding: 4px 0; }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    const STORAGE_KEY = "STORY_ENIGMA_LOCAL_V2";
    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { savedGames: [], currentStoryId: null };

    // Membuat data game baru yang benar-benar bersih/kosong
    const createBlankData = () => ({ maps: [], characters: [], items: [], monsters: [], logs: [] });

    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function getActiveGame() { return state.savedGames.find(g => g.id === state.currentStoryId); }

    const appEl = document.getElementById("app");

    function navigate() {
      if (!state.currentStoryId) { renderOpening(); } 
      else {
        const game = getActiveGame();
        if (game.mode === "setup") { renderSetupMode(game); } 
        else { renderMainMode(game); }
      }
    }

    // SCREEN 1: OPENING
    function renderOpening() {
      let listHtml = state.savedGames.map(game => `
        <button class="story-button" onclick="selectStory('${game.id}')">
          📁 ${game.title} <span>(${game.mode.toUpperCase()})</span>
        </button>
      `).join('');

      appEl.innerHTML = `
        <div class="opening-container">
          <h1 class="title">STORY ENIGMA</h1>
          <p class="subtitle">Aplikasi Engine TTRPG Modular</p>
          <div class="section">
            <div class="form-box">
              <h3 style="color:#ffd700;">Buat Skenario / Judul Baru</h3>
              <input type="text" id="newStoryTitle" class="input-text" placeholder="Masukkan Nama Skenario..." />
              <button class="main-action-btn" onclick="createNewStory()">Buat & Masuk Setup</button>
            </div>
          </div>
          ${state.savedGames.length > 0 ? `<div class="section"><h4 style="text-align:left; color:#aaa; margin-bottom:5px;">Lanjutkan Skenario:</h4><div class="list-container">${listHtml}</div></div>` : ''}
        </div>
      `;
    }

    window.createNewStory = () => {
      const txt = document.getElementById("newStoryTitle").value.trim();
      if (!txt) return alert("Judul wajib diisi!");
      const newGame = { id: "g_" + Date.now(), title: txt, mode: "setup", data: createBlankData() };
      state.savedGames.push(newGame);
      state.currentStoryId = newGame.id;
      saveState(); navigate();
    };

    window.selectStory = (id) => { state.currentStoryId = id; saveState(); navigate(); };

    // SCREEN 2: SETUP MODE (BISA TAMBAH SEMUA KOMPONEN SECARA BEBAS)
    let curSetupTab = "peta";
    function renderSetupMode(game) {
      appEl.innerHTML = `
        <div class="setup-container">
          <div class="header-bar">
            <button class="back-btn" onclick="exitToOpening()">⬅ Keluar</button>
            <h2>${game.title}</h2>
          </div>
          <div class="tab-bar">
            <button class="tab-btn ${curSetupTab==='peta'?'active':''}" onclick="setSetupTab('peta')">🗺️ PETA</button>
            <button class="tab-btn ${curSetupTab==='karakter'?'active':''}" onclick="setSetupTab('karakter')">👤 INVESTIGATOR</button>
            <button class="tab-btn ${curSetupTab==='item'?'active':''}" onclick="setSetupTab('item')">📦 ITEM</button>
            <button class="tab-btn ${curSetupTab==='n_panel'?'active':''}" onclick="setSetupTab('n_panel')">👹 ANCAMAN / NPC</button>
          </div>
          <div class="setup-content">${renderSetupTabContent(game)}</div>
          <div class="footer-bar">
            <span style="color:#666; font-size:0.8rem;">Fase Penyusunan</span>
            <button class="start-btn" onclick="tryStartMain()">Mulai Mode Main ▶</button>
          </div>
        </div>
      `;
    }

    function renderSetupTabContent(game) {
      if (curSetupTab === 'peta') {
        let itemsHtml = game.data.maps.map(m => `<div class="setup-card"><span>🗺️ ${m.name}</span><button class="del-btn" onclick="deleteData('maps','${m.id}')">Hapus</button></div>`).join('');
        return `
          <div class="form-box">
            <h4>Tambah Peta / Lokasi</h4>
            <input type="text" id="addMapName" class="input-text" placeholder="Contoh: Rumah Sakit Jiwa Lantai 1" />
            <button class="main-action-btn" onclick="addData('maps')">+ Simpan Peta</button>
          </div>
          <div>${itemsHtml || '<p style="color:#666;text-align:center;">Belum ada peta. Silakan tambah di atas.</p>'}</div>
        `;
      }
      if (curSetupTab === 'karakter') {
        let itemsHtml = game.data.characters.map(c => `<div class="setup-card"><div><strong>👤 ${c.name}</strong><br><small style="color:#aaa;">HP: ${c.stats.hp.max} | SAN: ${c.stats.sanity}</small></div><button class="del-btn" onclick="deleteData('characters','${c.id}')">Hapus</button></div>`).join('');
        return `
          <div class="form-box">
            <h4>Tambah Investigator</h4>
            <input type="text" id="addCharName" class="input-text" placeholder="Nama Karakter..." />
            <div class="input-row">
              <input type="number" id="addCharHp" class="input-text" placeholder="Max HP" value="10" />
              <input type="number" id="addCharSan" class="input-text" placeholder="Target Sanity (2-12)" value="7" />
            </div>
            <button class="main-action-btn" onclick="addData('characters')">+ Simpan Karakter</button>
          </div>
          <div>${itemsHtml || '<p style="color:#666;text-align:center;">Belum ada karakter.</p>'}</div>
        `;
      }
      if (curSetupTab === 'item') {
        let itemsHtml = game.data.items.map(i => `<div class="setup-card"><span>📦 [${i.type.toUpperCase()}] ${i.name}</span><button class="del-btn" onclick="deleteData('items','${i.id}')">Hapus</button></div>`).join('');
        return `
          <div class="form-box">
            <h4>Tambah Item / Senjata</h4>
            <input type="text" id="addItemName" class="input-text" placeholder="Nama Item..." />
            <select id="addItemType" class="input-text"><option value="alat">Alat Umum</option><option value="senjata">Senjata</option><option value="buku">Buku/Petunjuk</option></select>
            <button class="main-action-btn" onclick="addData('items')">+ Simpan Item</button>
          </div>
          <div>${itemsHtml || '<p style="color:#666;text-align:center;">Belum ada item.</p>'}</div>
        `;
      }
      if (curSetupTab === 'n_panel') {
        let itemsHtml = game.data.monsters.map(m => `<div class="setup-card"><span>👹 [${m.kind.toUpperCase()}] ${m.name} (HP: ${m.hp.max})</span><button class="del-btn" onclick="deleteData('monsters','${m.id}')">Hapus</button></div>`).join('');
        return `
          <div class="form-box">
            <h4>Tambah Monster / NPC / Villain</h4>
            <input type="text" id="addMonName" class="input-text" placeholder="Nama Entitas..." />
            <div class="input-row">
              <select id="addMonKind" class="input-text"><option value="monster">Monster</option><option value="npc">NPC Netral</option><option value="villain">Villain Utama</option></select>
              <input type="number" id="addMonHp" class="input-text" placeholder="HP" value="12" />
            </div>
            <button class="main-action-btn" onclick="addData('monsters')">+ Simpan Entitas</button>
          </div>
          <div>${itemsHtml || '<p style="color:#666;text-align:center;">Belum ada entitas bahaya.</p>'}</div>
        `;
      }
    }

    window.setSetupTab = (t) => { curSetupTab = t; navigate(); };
    window.exitToOpening = () => { state.currentStoryId = null; saveState(); navigate(); };

    // FUNGSI DINAMIS UNTUK TAMBAH DATA (INPUT BARU)
    window.addData = (type) => {
      const game = getActiveGame();
      if (type === 'maps') {
        const val = document.getElementById("addMapName").value.trim();
        if(!val) return; game.data.maps.push({ id: "m_" + Date.now(), name: val });
      } else if (type === 'characters') {
        const name = document.getElementById("addCharName").value.trim();
        const hp = parseInt(document.getElementById("addCharHp").value) || 10;
        const san = parseInt(document.getElementById("addCharSan").value) || 7;
        if(!name) return; game.data.characters.push({ id: "c_" + Date.now(), name, stats: { hp: { cur: hp, max: hp }, sanity: san, luck: 6 }, isDead: false });
      } else if (type === 'items') {
        const name = document.getElementById("addItemName").value.trim();
        const t = document.getElementById("addItemType").value;
        if(!name) return; game.data.items.push({ id: "i_" + Date.now(), name, type: t });
      } else if (type === 'monsters') {
        const name = document.getElementById("addMonName").value.trim();
        const kind = document.getElementById("addMonKind").value;
        const hp = parseInt(document.getElementById("addMonHp").value) || 10;
        if(!name) return; game.data.monsters.push({ id: "n_" + Date.now(), name, kind, hp: { cur: hp, max: hp } });
      }
      saveState(); navigate();
    };

    window.deleteData = (type, id) => {
      const game = getActiveGame();
      game.data[type] = game.data[type].filter(item => item.id !== id);
      saveState(); navigate();
    };

    window.tryStartMain = () => {
      const game = getActiveGame();
      if (game.data.maps.length === 0 || game.data.characters.length === 0) {
        return alert("Minimal harus mengisi 1 Peta dan 1 Investigator untuk mulai bermain!");
      }
      game.mode = "main"; saveState(); navigate();
    };

    // SCREEN 3: MAIN MODE (LANDSCAPE PENUH)
    let activeMainMenu = null;
    let selectedCharIdx = 0;

    function renderMainMode(game) {
      // Opsi dropdown untuk Bar SS diisi otomatis berdasarkan data yang diinput user
      let ssOptions = game.data.characters.map(c => `<option value="${c.name}">👤 ${c.name} (Skill)</option>`).join('');
      ssOptions += game.data.monsters.map(m => `<option value="${m.name}">👹 ${m.name} (Serangan)</option>`).join('');

      appEl.innerHTML = `
        <div class="main-container">
          <div class="map-layer ${activeMainMenu ? 'frozen' : ''}">
            <div style="text-align:center;">
              <h2 style="color:#ffd700; margin-bottom:5px;">🗺️ AKTIF: ${game.data.maps[0]?.name}</h2>
              <p style="font-size:0.85rem; color:#888;">Gunakan tombol navigasi M, C, S, I, N di pojok kiri untuk membuka menu.</p>
            </div>
          </div>

          <!-- HURUF TAKTIS M C S I N -->
          <button class="fixed-menu-btn ${activeMainMenu==='M'?'active':''}" style="left:8px; top:10px;" onclick="toggleMainMenu('M')">M</button>
          <button class="fixed-menu-btn ${activeMainMenu==='C'?'active':''}" style="left:46px; top:10px;" onclick="toggleMainMenu('C')">C</button>
          <button class="fixed-menu-btn ${activeMainMenu==='S'?'active':''}" style="left:84px; top:10px;" onclick="toggleMainMenu('S')">S</button>
          <button class="fixed-menu-btn ${activeMainMenu==='I'?'active':''}" style="left:8px; top:46px;" onclick="toggleMainMenu('I')">I</button>
          <button class="fixed-menu-btn ${activeMainMenu==='N'?'active':''}" style="left:8px; top:90px;" onclick="toggleMainMenu('N')">N</button>

          <div style="position:absolute; right:10px; top:10px; z-index:30;">
            <button onclick="changeMode('setup')" style="background:#aa3333; border:none; color:#fff; padding:5px 10px; border-radius:4px; font-size:0.75rem; cursor:pointer;">⚙️ Edit Setup</button>
          </div>

          <!-- POPOVER DISPLAY PANEL -->
          ${activeMainMenu ? `
            <div class="popover-panel">
              <div class="popover-header">
                <h3 style="color:#ffd700;">MENU PANEL: ${activeMainMenu}</h3>
                <button onclick="toggleMainMenu(null)" style="background:transparent; border:none; color:#888; cursor:pointer;">✕ Tutup</button>
              </div>
              <div>${renderMainPopoverContent(game)}</div>
            </div>
          ` : ''}

          <!-- BAR SS BAWAH -->
          <div class="bar-ss">
            <span style="font-size:0.75rem; color:#ffd700; white-space:nowrap;">🎲 ROLL 2D6:</span>
            <select id="ssSource" class="ss-select">${ssOptions || '<option value="Skenario">Skenario</option>'}</select>
            <input type="text" id="ssAction" class="ss-input" placeholder="Aksi/Skill..." style="flex:1;" />
            <span style="font-size:0.7rem; color:#aaa;">Target:</span>
            <input type="number" id="ssTarget" class="ss-input ss-input-num" min="2" max="12" value="7" />
            <span style="font-size:0.7rem; color:#aaa;">Dadu Fisik:</span>
            <input type="number" id="ssRoll" class="ss-input ss-input-num" min="2" max="12" placeholder="2-12" />
            <button class="ss-btn" onclick="submitRoll()">Roll</button>
          </div>
        </div>
      `;
    }

    function renderMainPopoverContent(game) {
      if (activeMainMenu === 'M') {
        return `<h4>Daftar Peta Tersedia:</h4><ul>` + game.data.maps.map(m => `<li>📍 ${m.name}</li>`).join('') + `</ul>`;
      }
      if (activeMainMenu === 'C') {
        return `<h4>Daftar Rombongan Investigator:</h4><ul>` + game.data.characters.map(c => `<li>👤 ${c.name} ${c.isDead?'[MATI]':''}</li>`).join('') + `</ul>`;
      }
      if (activeMainMenu === 'S') {
        if(game.data.characters.length === 0) return "<p>Tidak ada karakter.</p>";
        const c = game.data.characters[selectedCharIdx];
        const isHorrorActive = c.stats.hp.cur <= (c.stats.hp.max / 2);
        return `
          <div style="display:flex; flex-direction:column; gap:10px;">
            <div style="display:flex; justify-content:space-between;">
              <h4>Status Investigator: ${c.name}</h4>
              <div>
                <button onclick="modSelectedCharIdx(-1)" class="coc-btn" ${selectedCharIdx===0?'disabled':''}>‹</button>
                <span>${selectedCharIdx+1}/${game.data.characters.length}</span>
                <button onclick="modSelectedCharIdx(1)" class="coc-btn" ${selectedCharIdx>=game.data.characters.length-1?'disabled':''}>›</button>
              </div>
            </div>
            <div class="stat-card-grid">
              <div class="coc-stat-box"><span class="coc-label">HP</span><div class="coc-num-row"><button class="coc-btn" onclick="changeLiveHp(-1)">-</button><span class="coc-number">${c.stats.hp.cur}</span><button class="coc-btn" onclick="changeLiveHp(1)">+</button></div><span class="coc-label">Max: ${c.stats.hp.max}</span></div>
              <div class="coc-stat-box"><span class="coc-label">SANITY TARGET</span><div class="coc-num-row"><span></span><span class="coc-number">${c.stats.sanity}</span><span></span></div></div>
            </div>
            <div style="background:#111; padding:8px; border-radius:4px; border:1px solid ${isHorrorActive?'#8b0000':'#222'};">
              <span style="color:${isHorrorActive?'#ff4444':'#888'}; font-weight:bold; font-size:0.8rem;">💀 STATUS DADU HOROR: ${isHorrorActive?'AKTIF (HP ≤ 50%)':'NORMAL'}</span>
            </div>
          </div>
        `;
      }
      if (activeMainMenu === 'I') {
        return `<h4>Inventori Item Skenario:</h4><ul>` + game.data.items.map(i => `<li>📦 [${i.type.toUpperCase()}] ${i.name}</li>`).join('') + `</ul>`;
      }
      if (activeMainMenu === 'N') {
        return `<h4>Daftar Bahaya / NPC:</h4>` + game.data.monsters.map((m, idx) => `
          <div style="background:#111; padding:8px; border-radius:4px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
            <span>👹 <strong>${m.name}</strong> (${m.kind.toUpperCase()})</span>
            <div class="coc-num-row" style="gap:10px;">
              <button class="coc-btn" onclick="changeLiveMonsterHp(${idx},-1)">-</button>
              <span style="color:#ff4444; font-weight:bold;">HP: ${m.hp.cur}/${m.hp.max}</span>
              <button class="coc-btn" onclick="changeLiveMonsterHp(${idx},1)">+</button>
            </div>
          </div>
        `).join('');
      }
    }

    window.toggleMainMenu = (m) => { activeMainMenu = m; navigate(); };
    window.modSelectedCharIdx = (delta) => { selectedCharIdx += delta; navigate(); };
    
    window.changeLiveHp = (delta) => {
      const g = getActiveGame(); const c = g.data.characters[selectedCharIdx];
      c.stats.hp.cur = Math.max(0, Math.min(c.stats.hp.max, c.stats.hp.cur + delta));
      c.isDead = (c.stats.hp.cur === 0); saveState(); navigate();
    };

    window.changeLiveMonsterHp = (idx, delta) => {
      const g = getActiveGame(); const m = g.data.monsters[idx];
      m.hp.cur = Math.max(0, Math.min(m.hp.max, m.hp.cur + delta));
      saveState(); navigate();
    };

    window.submitRoll = () => {
      const source = document.getElementById("ssSource").value;
      const action = document.getElementById("ssAction").value.trim() || "Pengecekan Sistem";
      const target = parseInt(document.getElementById("ssTarget").value);
      const roll = parseInt(document.getElementById("ssRoll").value);

      if(isNaN(roll) || roll < 2 || roll > 12) return alert("Masukkan angka dadu fisik gabungan 2-12!");

      const outcome = compute2D6Outcome(roll, target);
      alert(`🎲 LOG REGISTERED!\n\n${source} melakukan ${action}\nHasil Dadu: ${roll} vs Target: ${target}\nStatus: ${outcome.text}`);
      
      document.getElementById("ssRoll").value = "";
    };

    navigate();
  </script>
</body>
</html>
